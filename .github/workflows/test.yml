name: Tests
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: '3.15-dev', python: '3.15-dev', os: ubuntu-latest}
          - {name: '3.14', python: '3.14', os: ubuntu-latest}
          - {name: '3.13', python: '3.13', os: ubuntu-latest}
          - {name: '3.12', python: '3.12', os: ubuntu-latest}
          - {name: '3.11', python: '3.11', os: ubuntu-latest}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: install dependencies
        run: |
          uv sync --frozen

      - name: Run Tests
        run: |
          uv run coverage run -m pytest tests
          uv run coverage report
          uv run coverage html
        
      - name: Upload Test Results 
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report-${{ matrix.name }}
          path: htmlcov
